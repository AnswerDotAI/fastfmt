[package]
name = "fastfmt"
version = "0.1.7"
edition = "2021"
license = "Apache-2.0"
description = "cargo fmt plus fastai-style compaction: keeps simple one-line constructs on one line"

[[bin]]
name = "cargo-fastfmt"
path = "src/main.rs"

[package.metadata.fastfmt]
join_comments = true

[dependencies]
ignore = "0.4.33"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1.0.151"
tree-sitter = "0.25.10"
tree-sitter-rust = "0.24.2"

[profile.dev]
opt-level = 2

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.fastfmt]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.fastfmt]
incremental = false
