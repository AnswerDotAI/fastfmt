[package]
name = "fastfmt"
version = "0.1.4"
edition = "2021"
license = "Apache-2.0"
description = "cargo fmt plus fastai-style compaction: keeps simple one-line constructs on one line"

[[bin]]
name = "cargo-fastfmt"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.25"
tree-sitter-rust = "0.24"

[profile.release]
lto = false
codegen-units = 16

[profile.release.package.fastfmt]
incremental = true

[profile.dist]
inherits = "release"
lto = true
incremental = false
codegen-units = 1
strip = true

[profile.dist.package.fastfmt]
incremental = false
