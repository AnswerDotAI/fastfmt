[build-system]
requires = ["maturin>=1.9.2,<2.0", "fastws-cli>=0.0.42"]
build-backend = "fastws.build_backend"

[project]
name = "fastfmt"
dynamic = ["version"]
description = "cargo fmt plus fastai-style compaction: keeps simple one-line constructs on one line"
license = "Apache-2.0"
requires-python = ">=3.11"
readme = "README.md"
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = ["Programming Language :: Rust"]

[project.optional-dependencies]
test = ["fastws-cli>=0.0.42", "pytest"]
dev = ["fastship>=0.0.11", "maturin>=1.0,<2.0", "fastfmt[test]"]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/fastfmt"
Repository = "https://github.com/AnswerDotAI/fastfmt"
Issues = "https://github.com/AnswerDotAI/fastfmt/issues"

Documentation = "https://AnswerDotAI.github.io/fastfmt/"
[tool.maturin]
bindings = "bin"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }]

[tool.fastship]
branch = "main"

[tool.pytest.ini_options]
testpaths = ["tests"]
